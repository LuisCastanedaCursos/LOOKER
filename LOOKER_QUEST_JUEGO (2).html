function ev(node,row,rows,depth=0){if(depth>80)throw Error('Expresión demasiado profunda');const go=(n,r=row)=>ev(n,r,rows,depth+1);switch(node.k){case'lit':return node.v;case'field':if(!(node.name in row))throw Error('Campo no disponible: '+node.name);return row[node.name];case'isnull':return node.neg?go(node.a)!==null:go(node.a)===null;case'un':return node.op==='NOT'?!go(node.a):-Number(go(node.a));case'bin':{const a=go(node.a),b=go(node.b);if(node.op==='AND')return Boolean(a)&&Boolean(b);if(node.op==='OR')return Boolean(a)||Boolean(b);if(node.op==='= '||node.op==='='||node.op==='==')return a===b;if(node.op==='!='||node.op==='<>')return a!==b;if(node.op==='>')return a!==null&&b!==null&&a>b;if(node.op==='<')return a!==null&&b!==null&&a<b;if(node.op==='>=')return a!==null&&b!==null&&a>=b;if(node.op==='<=')return a!==null&&b!==null&&a<=b;if(a===null||b===null)return null;if(node.op==='+')return Number(a)+Number(b);if(node.op==='-')return Number(a)-Number(b);if(node.op==='*')return Number(a)*Number(b);if(node.op==='/')return Number(b)===0?null:Number(a)/Number(b);throw Error('Operador no permitido')}case'case':for(const [c,a]of node.wh)if(go(c))return go(a);return go(node.other);case'call':{const fn=node.fn,arg=node.args;if(fn==='IF'){if(arg.length!==3)throw Error('IF requiere 3 argumentos');return go(arg[0])?go(arg[1]):go(arg[2])}if(fn==='IFNULL'){if(arg.length!==2)throw Error('IFNULL requiere 2 argumentos');const v=go(arg[0]);return v===null?go(arg[1]):v}if(['SUM','AVG','COUNT','COUNT_DISTINCT','MIN','MAX'].includes(fn)){if(arg.length!==1)throw Error(fn+' necesita un argumento');let vals=rows.map(r=>go(arg[0],r)).filter(v=>v!==null&&v!==undefined);if(fn==='SUM')return vals.reduce((a,b)=>a+Number(b),0);if(fn==='AVG')return vals.length?vals.reduce((a,b)=>a+Number(b),0)/vals.length:null;if(fn==='COUNT')return vals.length;if(fn==='COUNT_DISTINCT')return new Set(vals).size;if(fn==='MIN')return Math.min(...vals);if(fn==='MAX')return Math.max(...vals)}let a=arg.map(x=>go(x const MISSION_DETAILS=["Utiliza una suma fila a fila: el recargo se agrega al valor base. Conserva ambos valores y calcula el total por factura.", "Resta lo que ya se pagó al valor original. Un saldo negativo puede indicar pago mayor que la factura: no lo elimines.", "Multiplica las unidades consumidas por la tarifa correspondiente. Comprueba que las unidades y la tarifa sean numéricas.", "Divide el importe pagado entre el facturado. El resultado es una proporción: 0,5 equivale a 50 %. Si el denominador es cero, hay que revisar el caso.", "Une dos códigos de texto usando un guion entre ellos. No sumes los códigos: el resultado es un identificador textual.", "Identifica espacios exteriores visibles entre corchetes; elimina solo los del comienzo y el final, sin cambiar las letras.", "Primero quita espacios exteriores y después convierte toda la categoría del servicio a letras mayúsculas.", "El correo se normaliza a minúsculas y se recortan espacios exteriores; no se debe inventar una dirección ausente.", "Cambia cada punto del identificador por un guion; conserva las letras y los números sin alterarlos.", "Cuenta cuántos caracteres contiene cada código DANE. Longitud cinco es necesaria, pero por sí sola no demuestra que exista.", "Si el consumo es menor que cero devuelve REVISAR; de lo contrario, OK. IF tiene condición, resultado verdadero y falso.", "Compara el importe pagado contra el importe facturado: si cubre la factura clasifica PAGADO; en otro caso PENDIENTE.", "CASE evalúa varias reglas en orden: consumo negativo es REVISAR; cero es CERO; cualquier otro valor es POSITIVO.", "Comprueba simultáneamente los límites 1 y 6 mediante AND. Fuera de esos límites es REVISAR para el ejercicio residencial.", "Hay mayúsculas, minúsculas y espacios. Normaliza primero y clasifica PAGADO/PENDIENTE; usa una salida final para las categorías desconocidas.", "Cuando el campo PQR es realmente NULL muestra SIN REGISTRO. El texto literal NULL y la cadena vacía son casos diferentes.", "Convierte la cadena vacía exacta en un NULL real; si hay espacios, recuerda que la cadena deja de estar vacía.", "Distingue NULL real y cadenas que quedan vacías tras quitar espacios; devuelve VACIO para ambos casos.", "Usa OR: la alerta se activa si el consumo es negativo o supera 1000. No exige que se cumplan las dos condiciones.", "Una etiqueta de servicio no se considera informada si es NULL, vacía o contiene solo espacios exteriores.", "Valida que el texto tenga exactamente cinco dígitos, sin letras ni espacios. Esta comprobación revisa formato, no existencia del municipio.", "La expresión regular busca dos o más espacios seguidos y los reemplaza por uno. A diferencia de REPLACE, trabaja con patrones.", "Elimina cualquiera de los separadores guion, punto o barra mediante un mismo patrón. Mantén intactos los caracteres restantes.", "Redondea el consumo numérico a dos decimales. Redondear no corrige consumos negativos ni fuera de rango.", "Extrae los primeros dos caracteres del código de cinco posiciones, empezando por la posición 1.", "Primero transforma cada consumo negativo en 1 y los demás en 0; después suma esos indicadores. El resultado es un conteo de alertas.", "Calcula la media aritmética de los consumos de la muestra mediante AVG. Distingue el promedio de cada registro y una agregación.", "Cuenta los identificadores diferentes, no el número total de filas. Una factura repetida se cuenta una sola vez.", "Suma los pagos y las facturas por separado antes de dividir. La razón entre totales es diferente del promedio de razones individuales.", "Cuenta con SUM y CASE las filas que cumplen al menos una de estas alertas: consumo negativo o código DANE con formato inválido."];
function syntaxHelp(l){let f=l.formula; if(f.startsWith('CASE'))return 'CASE WHEN condición THEN resultado ELSE alternativa END'; if(f.startsWith('IF('))return 'IF(condición, valor_si_verdadero, valor_si_falso)'; if(f.startsWith('SUM('))return 'SUM(expresión numérica por fila)'; if(f.startsWith('AVG('))return 'AVG(campo numérico)'; const m=f.match(/^([A-Z_]+)\(/); if(m)return m[1]+'(campo, argumento...)'; return 'campo1 [operador] campo2';}
function dataOf(l){return l.rows.map(r=>Object.fromEntries(l.fields.map((f,i)=>[f,r[i]])))}
function same(a,b){if(typeof a==='number'&&typeof b==='number')return Math.abs(a-b)<1e-7;return a===b}
function evaluate(formula,l){const ast=parse(formula),ref=parse(l.formula),rows=dataOf(l);const a=rows.map(r=>ev(ast,r,rows)),b=rows.map(r=>ev(ref,r,rows));return{ok:a.every((v,i)=>same(v,b[i])),a,b,errors:a.map((v,i)=>!same(v,b[i]))}}

document.querySelectorAll('[data-operator]').forEach(b=>b.onclick=()=>insertToken(' '+b.dataset.operator+' '));document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(Number(b.dataset.go)));document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{state.guided[i]=Number(b.dataset.choice);save();document.querySelectorAll('[data-choice]').forEach(c=>c.classList.toggle('chosen',c===b));$('guidefb').textContent=state.guided[i]===l.correct?'✓ Correcto. Puedes continuar.':'Esa opción no corresponde a la explicación. Lee la sintaxis y prueba otra respuesta.'});$('validate').onclick=validate;$('hint').onclick=showHint;$('clear').onclick=()=>{$('formula').value='';typed='';$('formula').focus()};$('prev').onclick=()=>go(i-1);$('results').onclick=results;$('restart').onclick=()=>{if(confirm('¿Borrar el progreso guardado y empezar de nuevo?')){localStorage.removeItem(key);state={name:'',area:'',current:0,best:{},unlocked:0,attempts:{},hints:{},guided:{},interpreted:{}};mount()}};if(correctFormula&&$('next'))$('next').onclick=()=>{if(i===29)results();else go(i+1)};
}
function validate(){let i=state.current,l=LEVELS[i],formula=$('formula').value.trim();if(!formula){feedbackType='error';feedback='Aún no has escrito una fórmula. Utiliza los botones de campos o funciones, o escribe directamente en el editor.';mount();return}state.attempts[i]=(state.attempts[i]||0)+1;try{let v=evaluate(formula,l);lastValues=v.a;lastExpected=v.b;checkRows=v.errors;checked=true;if(v.ok){feedbackType='success';correctFormula=true;let guided=state.guided[i]===l.correct?15:0,points=55+guided+20+((state.hints[i]||0)===0?10:Math.max(0,10-3*(state.hints[i]||0)));state.best[i]=Math.max(state.best[i]||0,points);state.unlocked=Math.max(state.unlocked,Math.min(29,i+1));state.discovered=[...new Set([...(state.discovered||[]),l.clue])];feedback='La fórmula produce el resultado correcto en todas las filas. Misión: '+state.best[i]+'/100 puntos.'}else{feedbackType='error';let bad=v.errors.map((e,j)=>e?`Fila ${j+1}: obtuviste ${fmt(v.a[j])}, se esperaba ${fmt(v.b[j])}`:null).filter(Boolean);feedback='La sintaxis se pudo interpretar, pero hay '+bad.length+' fila(s) incorrecta(s). '+bad.slice(0,4).join(' | ')+'. Comprueba el orden de las condiciones, los operadores y el tratamiento de los valores vacíos.'}save();mount()}catch(e){lastValues=[];lastExpected=[];checkRows=[];feedbackType='error';let msg=e.message;if(msg.includes('Campo no disponible:'))msg+='. Selecciona un campo de la lista, respetando exactamente su nombre.';else if(msg.includes('Se esperaba'))msg+='. Comprueba los paréntesis, las comas y las palabras clave.';else if(msg.includes('Función no admitida'))msg+='. Elige una función de la biblioteca que aparece encima del editor.';feedback='No se pudo calcular el campo. '+msg+' Revisa el nombre exacto de los campos, las comas entre argumentos, los paréntesis y el tipo de resultado.';save();mount()}}

function showHint(){let i=state.current,l=LEVELS[i],h=Math.min(3,(state.hints[i]||0)+1);state.hints[i]=h;save();let f=l.formula;let text=h===1?'Función o idea clave: '+(f.match(/\b(IFNULL|NULLIF|CASE|IF|REGEXP_MATCH|REGEXP_REPLACE|COUNT_DISTINCT|SUM|AVG|TRIM|UPPER|LOWER|CONCAT|REPLACE|LENGTH|ROUND|SUBSTR)\b/)||['operadores'])[0]:h===2?'Estructura sugerida: '+f.replaceAll(l.fields[0],'[CAMPO]').replace(/"[^"\n]+"/g,'"…"'):f.replace(l.fields[0],'__________');$('hintbox').innerHTML='<div class="hintcontent">💡 '+esc(text)+'</div>';if((state.attempts[i]||0)>=3)$('hintbox').innerHTML+='<p class="small">Puedes volver a intentarlo tantas veces como necesites.</p>';}
function go(i){if(i<0||i>state.unlocked)return;state.current=i;typed='';feedback='';lastValues=[];lastExpected=[];checkRows=[];feedbackType='info';correctFormula=false;save();mount()}
function csvExport(){let rows=[['nivel','capitulo','mision','puntos','intentos','pistas']];LEVELS.forEach((l,i)=>rows.push([i+1,l.ch,l.title,state.best[i]||0,state.attempts[i]||0,state.hints[i]||0]));let str=rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+str],{type:'text/csv'}));a.download='Resultados_Looker_Quest.csv';a.click();URL.revokeObjectURL(a.href)}
function results(){let pts=total(),grade=pts/30,eq=pts/600,done=Object.keys(state.best).length,rank=grade>=90?'Experto en campos calculados':grade>=80?'Analista avanzado':grade>=70?'Analista competente':grade>=60?'Analista en formación':'Requiere refuerzo';$('app').innerHTML=`<div class="summary"><button class="ghost" id="back">← Volver al juego</button><p class="eyebrow">EXPEDIENTE DE INVESTIGACIÓN</p><h1>Resultados de ${esc(state.name)}</h1><div class="scores"><div><b>${pts}</b><span>de 3000 puntos</span></div><div><b>${grade.toFixed(1)}</b><span>calificación /100</span></div><div><b>${eq.toFixed(2)}</b><span>nota /5,0</span></div><div><b>${done}/30</b><span>misiones completas</span></div></div><h2>${esc(rank)}</h2><div class="chapterresults">${chapters.map((n,c)=>{let val=LEVELS.slice(c*5,c*5+5).reduce((sum,l,j)=>sum+(state.best[c*5+j]||0),0);return`<div><span>${badges[c]} ${esc(n)}</span><div class="mini"><i style="width:${val/5}%"></i></div><b>${val}/500</b></div>`}).join('')}</div><div class="resultactions"><button class="primary" id="export">⬇ Exportar resultados CSV</button><button class="ghost" id="cert" ${done!==30?'disabled title="Completa las 30 misiones"':''}>🎓 Certificado / PDF</button></div><p class="small">El progreso está guardado únicamente en este navegador, si su configuración lo permite. Para obtener el certificado debes completar las 30 misiones.</p></div>`;$('back').onclick=mount;$('export').onclick=csvExport;$('cert').onclick=certificate}
function certificate(){let pts=total(),grade=pts/30,done=Object.keys(state.best).length;if(done!==30)return;let score=(pts/600).toFixed(2),date=new Date().toLocaleDateString('es-CO'),code='LQ-'+String(pts)+'-'+state.name.toUpperCase().replace(/[^A-Z]/g,'').slice(0,4)+'-30';$('app').innerHTML=`<div class="certificate"><div class="certborder"><p class="eyebrow">PROGRAMA DE FORMACIÓN INTERNA</p><div class="certicon">🏅</div><h1>${grade>=60?'CERTIFICADO DE APROVECHAMIENTO':'CONSTANCIA DE PARTICIPACIÓN'}</h1><p>Se certifica que</p><h2>${esc(state.name)}</h2><p>${esc(state.area||'Participante')}</p><p>completó 30 misiones de la experiencia educativa</p><h3>LOOKER QUEST — CAMPOS CALCULADOS EN LOOKER STUDIO</h3><p>Aprendió a investigar inconsistencias, crear campos calculados, utilizar IF y CASE y construir indicadores de calidad de datos.</p><div class="certstats"><span>Puntuación <b>${pts}/3000</b></span><span>Nota <b>${grade.toFixed(1)}/100</b></span><span>Equivalencia <b>${score}/5,0</b></span></div><p>${esc(date)} · Código interno: ${esc(code)}</p><p class="small">Programa de formación interna · No constituye certificación oficial de Google ni de Superservicios.</p></div><div class="printactions"><button class="ghost" id="back">← Resultados</button><button class="primary" id="print">Imprimir / Guardar como PDF</button></div></div>`;$('back').onclick=results;$('print').onclick=()=>window.print()}
mount();
</script></body></html>
